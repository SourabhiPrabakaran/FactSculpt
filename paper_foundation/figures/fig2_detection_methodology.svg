<svg xmlns="http://www.w3.org/2000/svg" width="3.5in" height="7.583in" viewBox="0 0 360 780">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#222"/></marker></defs>
<rect width="360" height="780" fill="white"/>
<rect x="35" y="12" width="230" height="34" rx="4" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="150.0" y="33.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Validate nonempty texts</text>
<rect x="35" y="75" width="290" height="42" rx="4" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="180.0" y="100.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Extract claims; attach evidence profiles</text>
<rect x="35" y="146" width="290" height="42" rx="4" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="180.0" y="171.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Align each generated claim to source claims</text>
<polyline points="180,46 180,75" fill="none" stroke="#222" stroke-width="1.2" marker-end="url(#arrow)"/>
<polyline points="180,117 180,146" fill="none" stroke="#222" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="285" y="12" width="70" height="34" rx="4" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="320.0" y="26.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Reject</text>
<text x="320.0" y="41.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">empty input</text>
<polyline points="265,29 285,29" fill="none" stroke="#222" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="90" y="222" width="180" height="36" rx="4" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="180.0" y="244.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Aligned match?</text>
<polyline points="180,188 180,222" fill="none" stroke="#222" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="8" y="296" width="155" height="62" rx="4" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="85.5" y="324.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Yes: compare profiles</text>
<text x="85.5" y="339.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">and run pairwise NLI</text>
<rect x="185" y="296" width="167" height="62" rx="4" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="268.5" y="317.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">No: missing-source delta;</text>
<text x="268.5" y="332.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">neutral NLI placeholder;</text>
<text x="268.5" y="347.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">unsupported flag = true</text>
<polyline points="120,258 85,280 85,296" fill="none" stroke="#222" stroke-width="1.2" marker-end="url(#arrow)"/>
<polyline points="240,258 269,280 269,296" fill="none" stroke="#222" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="35" y="394" width="290" height="46" rx="4" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="180.0" y="414.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Generate feature payload</text>
<text x="180.0" y="429.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Six signed shifts + NLI + alignment</text>
<polyline points="85,358 85,377 140,377 140,394" fill="none" stroke="#222" stroke-width="1.2" marker-end="url(#arrow)"/>
<polyline points="269,358 269,377 220,377 220,394" fill="none" stroke="#222" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="25" y="472" width="310" height="188" rx="4" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="180.0" y="521.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Research-rule precedence (first match)</text>
<text x="180.0" y="536.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">1. Unsupported flag -&gt; C4</text>
<text x="180.0" y="551.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">2. Positive AND negative shifts -&gt; C5</text>
<text x="180.0" y="566.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">3. Positive shifts only -&gt; C3</text>
<text x="180.0" y="581.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">4. Negative shifts only -&gt; C2</text>
<text x="180.0" y="596.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">5. Contradiction &gt;= 0.5 -&gt; C5</text>
<text x="180.0" y="611.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">6. Otherwise -&gt; C1</text>
<text x="180.0" y="626.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Positive &gt; 0.05; negative &lt; -0.05</text>
<polyline points="180,440 180,472" fill="none" stroke="#222" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="35" y="695" width="290" height="48" rx="4" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="180.0" y="716.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Return per-claim results and label counts</text>
<text x="180.0" y="731.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Repeat processing for generated claims</text>
<polyline points="180,660 180,695" fill="none" stroke="#222" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="180" y="767" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#111">Research taxonomy requires explicit configuration.</text>
</svg>
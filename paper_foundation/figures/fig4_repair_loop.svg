<svg xmlns="http://www.w3.org/2000/svg" width="3.5in" height="7.097in" viewBox="0 0 360 730">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#222"/></marker></defs>
<rect width="360" height="730" fill="white"/>
<rect x="45" y="12" width="270" height="42" rx="4" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="180.0" y="37.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Source text + current rewritten text</text>
<rect x="30" y="88" width="300" height="74" rx="4" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="180.0" y="108.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Lightweight whole-text detection</text>
<text x="180.0" y="123.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Profiles -&gt; handcoded differences -&gt; rules</text>
<text x="180.0" y="138.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Pseudo-NLI: entailment = 1 - severity</text>
<text x="180.0" y="153.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">No claim alignment or pretrained NLI here</text>
<polyline points="180,54 180,88" fill="none" stroke="#222" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="45" y="198" width="270" height="48" rx="4" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="180.0" y="226.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">C1 / C2 OR severity &lt;= 0.15?</text>
<polyline points="180,162 180,198" fill="none" stroke="#222" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="12" y="285" width="130" height="44" rx="4" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="77.0" y="304.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Yes: return</text>
<text x="77.0" y="319.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">already_safe</text>
<polyline points="70,246 70,285" fill="none" stroke="#222" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="170" y="285" width="180" height="60" rx="4" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="260.0" y="312.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">No: detect current text;</text>
<text x="260.0" y="327.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">select shifts &gt; 0.05</text>
<polyline points="260,246 260,285" fill="none" stroke="#222" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="170" y="378" width="180" height="60" rx="4" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="260.0" y="405.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Stop if no flags, C1/C2,</text>
<text x="260.0" y="420.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">or severity &lt;= 0.15</text>
<polyline points="260,345 260,378" fill="none" stroke="#222" stroke-width="1.2" marker-end="url(#arrow)"/>
<polyline points="170,407 80,407 80,480" fill="none" stroke="#222" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="98.8" y="386" width="26.4" height="13" fill="white"/>
<text x="112" y="396" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#111">stop</text>
<rect x="12" y="480" width="130" height="56" rx="4" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="77.0" y="505.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Return current text</text>
<text x="77.0" y="520.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">+ reason + step logs</text>
<rect x="170" y="480" width="180" height="56" rx="4" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="260.0" y="505.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Otherwise: regex edits</text>
<text x="260.0" y="520.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">of flagged attributes</text>
<polyline points="260,438 260,480" fill="none" stroke="#222" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="170" y="575" width="180" height="56" rx="4" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="260.0" y="600.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Verify using same detector</text>
<text x="260.0" y="615.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Safe OR limit reached?</text>
<polyline points="260,536 260,575" fill="none" stroke="#222" stroke-width="1.2" marker-end="url(#arrow)"/>
<polyline points="170,603 80,603 80,536" fill="none" stroke="#222" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="105.35" y="581" width="21.299999999999997" height="13" fill="white"/>
<text x="116" y="591" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#111">yes</text>
<polyline points="285,631 285,665 358,665 358,270 300,270 300,285" fill="none" stroke="#222" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="234.1" y="673" width="97.8" height="13" fill="white"/>
<text x="283" y="683" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#111">no: next iteration</text>
<text x="180" y="715" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#111">Default: at most 3 edits. Verified-safe is an internal rule status.</text>
</svg>